.spinner { width: 40px; height: 40px; border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid var(--rbx-blue); border-radius: 50%; animation: spin 0.8s linear infinite; }

.shake { animation: shake 0.2s ease-in-out 0s 2; }
</style>
