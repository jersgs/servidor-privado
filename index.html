<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar na Roblox</title>
    <link rel="icon" type="image/png" href="https://images.rbxcdn.com/241804f5603781f8f3593019f39e830e.ico">
    <style>
        /* FONTES E CORES OFICIAIS FOUNDATION */
        @import url('https://fonts.googleapis.com/css2?family=HCo+Gotham+SSm:wght@400;500;700&display=swap');

        :root {
            --bg-main: #121215;
            --bg-card: #191a1f;
            --bg-header: #202227;
            --input-bg: #121215;
            --rbx-blue: #335fff;
            --rbx-blue-hover: #528bff;
            --rbx-error: #df281f;
            --text-main: #ffffff;
            --text-muted: #bcbec8;
            --border-standard: rgba(255, 255, 255, 0.1);
            --radius-main: 8px;
        }a

        /* BARRA DE ROLAGEM ESTILIZADA */
        ::-webkit-scrollbar { width: 14px; }
        ::-webkit-scrollbar-track { background: var(--bg-card); }
        ::-webkit-scrollbar-thumb { 
            background: #65666a; 
            border: 3px solid var(--bg-card); 
            border-radius: 10px; 
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'HCo Gotham SSm', -apple-system, BlinkMacSystemFont, sans-serif; 
            background-color: var(--bg-main); color: var(--text-main);
            overflow-x: hidden;
        }

        /* CABEÇALHO REPLICADO */
        .roblox-header { 
            width: 100%; height: 44px; background: var(--bg-header); 
            display: flex; align-items: center; padding: 0 16px; 
            position: fixed; top: 0; z-index: 100; box-sizing: border-box; 
            border-bottom: 1px solid var(--border-standard); 
        }

        .header-left { display: flex; align-items: center; flex-grow: 1; }

        .roblox-logo { 
            height: 28px; width: 28px; fill: white; cursor: pointer; margin-right: 12px;
        }

        .nav-links {
            display: flex; gap: 24px; font-size: 15px; font-weight: 500; color: #fff;
            align-items: center;
        }

        /* BARRA DE PESQUISA CORRIGIDA */
        .search-container {
            margin-left: 20px; 
            position: relative; 
            width: 280px;
            display: flex;
            align-items: center;
        }

        .search-bar {
            background: rgba(0,0,0,0.2); 
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 4px; 
            height: 28px; 
            width: 100%; 
            display: flex; 
            align-items: center; 
            padding: 0 10px 0 35px; /* Espaço para a lupa à esquerda */
            box-sizing: border-box; 
            color: #fff; 
            font-size: 13px;
        }

        .search-icon {
            position: absolute; 
            left: 10px; /* Lupa posicionada à esquerda */
            width: 16px; 
            height: 16px; 
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>') no-repeat center;
            opacity: 0.7;
            pointer-events: none;
        }

        /* BOTÕES DE TOPO */
        .header-right { display: flex; align-items: center; gap: 8px; }

        .btn-header-signup {
            background-color: var(--rbx-blue); color: white; border: none;
            padding: 5px 14px; border-radius: 6px; font-weight: 600; font-size: 14px;
            cursor: pointer; transition: background 0.2s; white-space: nowrap;
        }

        .btn-header-login {
            background: transparent; color: white; border: 1px solid white;
            padding: 4px 14px; border-radius: 6px; font-weight: 600; font-size: 14px;
            cursor: pointer; transition: background 0.2s; white-space: nowrap;
        }

        /* CONTEÚDO CENTRAL */
        .main-content { 
            min-height: 100vh; display: flex; align-items: center; justify-content: center; 
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.rbxcdn.com/a19e4c27a0694a1d0fd5ceb17c978a7a-marketing_bg_05222025.jpg'); 
            background-size: cover; background-position: center; padding-top: 44px;
        }

        .login-card { 
            background-color: var(--bg-card); padding: 40px 32px; border-radius: var(--radius-main); 
            width: 420px; text-align: center; box-shadow: 0 12px 50px rgba(0,0,0,0.8); 
            box-sizing: border-box; position: relative; border: 1px solid rgba(255,255,255,0.05);
        }

        h1 { margin-bottom: 28px; font-weight: 700; font-size: 28px; color: #fff; letter-spacing: -0.5px; }

        .input-field { 
            width: 100%; height: 48px; background-color: var(--input-bg); 
            border: 1px solid rgba(255,255,255,0.15); border-radius: 6px; color: #fff; 
            padding: 0 12px; margin-bottom: 12px; box-sizing: border-box; outline: none; 
            transition: all 0.2s ease; font-size: 16px; 
        }

        .input-field:focus { border-color: #fff; background-color: #1d1d22; }

        .btn-primary { 
            width: 100%; height: 46px; background-color: var(--rbx-blue); color: #fff; 
            border: none; border-radius: 6px; font-size: 17px; 
            font-weight: 600; cursor: pointer; margin-top: 10px; transition: background 0.2s ease; 
        }

        /* FEEDBACK DE ERRO */
        #error-msg { 
            color: var(--rbx-error); font-size: 13px; margin-bottom: 15px; display: none; 
            text-align: left; background: rgba(223, 40, 31, 0.15); padding: 12px; 
            border-radius: 4px; border-left: 4px solid var(--rbx-error); 
        }

        #loading-overlay { 
            background-color: rgba(0,0,0,0.9); position: fixed; inset: 0; z-index: 2000; 
            display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px); 
        }

        .spinner { 
            width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.1); 
            border-top: 5px solid var(--rbx-blue); border-radius: 50%; animation: spin 0.8s linear infinite; 
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
        .shake { animation: shake 0.2s ease-in-out 0s 2; }
    </style>
</head>
<body>

    <div id="loading-overlay"><div class="spinner"></div></div>

    <header class="roblox-header">
        <div class="header-left">
            <svg class="roblox-logo" viewBox="0 0 28 28">
                <path d="M7.05 4L24 7.05 20.95 24 4 20.95 7.05 4zM11.5 16.5h5v-5h-5v5z"/>
            </svg>
            <div class="nav-links">
                <span>Destaques</span>
                <span>Mercado</span>
                <span>Criar</span>
                <span>Robux</span>
                <div class="search-container">
                    <div class="search-icon"></div>
                    <div class="search-bar">Pesquisar</div>
                </div>
            </div>
        </div>
        
        <div class="header-right">
            <button class="btn-header-signup">Cadastrar-se</button>
            <button class="btn-header-login">Entrar</button>
        </div>
    </header>

    <main class="main-content">
        <div class="login-card" id="card">
            <h1>Entrar na Roblox</h1>
            
            <div id="error-msg">Usuário ou senha incorretos. Por favor, tente novamente.</div>

            <input type="text" id="user" class="input-field" placeholder="Usuário/e-mail/telefone" autocomplete="off" oninput="resetStyles()">
            <input type="password" id="pass" class="input-field" placeholder="Senha" oninput="resetStyles()">
            
            <button class="btn-primary" onclick="execLogin()">Entrar</button>

            <div style="margin-top:20px; font-size: 14px;">
                <a href="#" style="color: #bcbec8; text-decoration: none;">Esqueceu a senha ou nome de usuário?</a>
            </div>

            <div style="margin-top:24px; border-top:1px solid var(--border-standard); padding-top:20px; display: flex; flex-direction: column; gap: 12px;">
                <button style="width:100%; height:42px; background:#393b43; border:none; color:#fff; border-radius:6px; font-weight:600; cursor:pointer;">Envie-me um código único por e-mail</button>
                <button style="width:100%; height:42px; background:#393b43; border:none; color:#fff; border-radius:6px; font-weight:600; cursor:pointer;">Entrada rápida</button>
            </div>

            <p style="margin-top:25px; font-size:15px; color: var(--text-muted)">
                Não possui uma conta? 
                <a href="#" style="color:#fff; text-decoration:none; font-weight:700">Cadastrar-se</a>
            </p>
        </div>
    </main>
